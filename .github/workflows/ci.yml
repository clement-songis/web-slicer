# Gates de la constitution (IV) + contrôle de parité (V).
# Trois jobs indépendants : audit (Python pur), rust (via devShell Nix pour
# $LIBSLIC3R_DIR), frontend (Bun).
name: CI

on:
  push:
    branches: [main, harness, "0*"]
  pull_request:

jobs:
  audit:
    name: Parité (audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Source Orca de référence (release 2.4.1)
        run: |
          ORCA_SRC="$(nix eval --raw .#orca-src)"
          nix build .#orca-src
          echo "ORCA_SRC=$ORCA_SRC" >> "$GITHUB_ENV"
      - name: Inventaires ré-exécutables et déterministes
        run: |
          python3 audit/run_all.py
          md5sum audit/*.json > /tmp/sums
          python3 audit/run_all.py
          md5sum -c /tmp/sums
      - name: Annexes synchronisées avec la spec
        run: |
          python3 audit/generate_parity_annexes.py
          git diff --exit-code -- specs audit
      - name: Traçabilité (gate FR-003)
        run: |
          if [ -f audit/check_traceability.py ]; then python3 audit/check_traceability.py; fi

  rust:
    name: Backend + engine (fmt, clippy -D warnings, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      # build.rs d'engine (feature ffi) exige LIBSLIC3R_DIR et ORCA_SRC. Sur le
      # runner, l'héritage via nix develop --command ne les a pas transmis au
      # build script (run 45164342639 : « LIBSLIC3R_DIR ... NotPresent » alors
      # que la bannière du devShell les affiche). On les exporte explicitement ;
      # nix develop construit les chemins correspondants (inputs du devShell).
      - name: Env moteur pour build.rs (LIBSLIC3R_DIR + ORCA_SRC)
        run: |
          echo "LIBSLIC3R_DIR=$(nix eval --raw .#libslic3r.outPath)" >> "$GITHUB_ENV"
          echo "ORCA_SRC=$(nix eval --raw .#orca-src)" >> "$GITHUB_ENV"
      - name: "Gates Rust (devShell : toolchain + $LIBSLIC3R_DIR)"
        run: |
          # nix develop --command perd des variables sur le runner (LIBSLIC3R_DIR,
          # NIX_CFLAGS_COMPILE du wrapper clang : boost introuvable — run 45176076419).
          # On source l'environnement exact du devShell, comme .work/devenv.sh en local.
          nix print-dev-env > "$RUNNER_TEMP/devenv.sh"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/devenv.sh"
          set -euo pipefail
          cargo fmt --check
          cargo clippy --workspace -- -D warnings
          # --features engine/ffi : construit aussi le binaire engine-worker
          # (required-features = ffi) que les tests backend d'export spawnent
          # (résolution par voisin dans target/debug). Sans lui, toute requête
          # d'export échoue en 500 (reproduit : 8 échecs http_export).
          cargo test --workspace --features engine/ffi
      - name: Fraîcheur des bindings ts-rs (jamais édités à la main)
        run: git diff --exit-code -- frontend/src/generated/api

  frontend:
    name: Frontend (lint, check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Source Orca de référence (release 2.4.1)
        run: |
          ORCA_SRC="$(nix eval --raw .#orca-src)"
          nix build .#orca-src
          echo "ORCA_SRC=$ORCA_SRC" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run test
